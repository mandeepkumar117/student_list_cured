<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>

<body>

    <h1>Edit Student</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Student Name:</label>
        <input
            type="text"
            name="student_name"
            value="{{ student.student_name }}"
        >

        <br><br>

        <label>Student Email:</label>
        <input
            type="email"
            name="student_email"
            value="{{ student.student_email }}"
        >

        <br><br>

        <label>Student Course:</label>
        <input
            type="text"
            name="student_course"
            value="{{ student.student_course }}"
        >

        <br><br>

        <label>Student Fees:</label>
        <input
            type="number"
            name="student_fees"
            value="{{ student.student_fees }}"
        >

        <br><br>

        <button type="submit">
            Update Student
        </button>

    </form>

</body>
</html>
